name: vprofile CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# Trigger rules
#   • push to main        → docker-build-push + update-helm  (no sonar)
#   • pull_request → main → build-and-sonar only              (no docker/helm)
#   • push to any other branch → nothing runs
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 – Maven build + Checkstyle + SonarQube scan + Quality Gate
  # Runs ONLY on pull_request events targeting main.
  # ═══════════════════════════════════════════════════════════════════════════
  build-and-sonar:
    name: Build & SonarQube Analysis
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Fetch full history so SonarQube can track blame / new-code periods
          fetch-depth: 0

      # ── Java 21 ───────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ── Caching ───────────────────────────────────────────────────────────
      # Cache the local Maven repository (~/.m2/repository) so dependencies
      # are not re-downloaded on every PR run.
      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # SonarQube Scanner also downloads its own analysis engine the first
      # time; cache it to avoid repeated downloads.
      - name: Cache SonarQube scanner packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      # ── Maven: compile + unit tests + Checkstyle ──────────────────────────
      # 'verify' runs: compile → test → package → verify (includes checkstyle
      # and jacoco via the plugins declared in pom.xml).
      - name: Build, test & Checkstyle
        run: mvn clean verify -B

      # ── SonarQube scan ────────────────────────────────────────────────────
      # ── SonarQube scan + Quality Gate ────────────────────────────────────
      # Uses the Maven sonar plugin directly (recommended for Maven projects).
      # -Dsonar.qualitygate.wait=true makes the plugin poll the gate result
      # after uploading and fail the build if the gate is not "OK" — no
      # separate quality-gate action needed (and avoids the .scannerwork
      # report-task.txt path mismatch that action has with mvn sonar:sonar).
      # Settings are read from sonar-project.properties at the repo root.
      - name: SonarQube scan & Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 – Docker build & push to Amazon ECR
  # Runs ONLY on push to main (not on PRs).
  # Outputs: ecr_registry, image_tag  — consumed by update-helm.
  # ═══════════════════════════════════════════════════════════════════════════
  docker-build-push:
    name: Docker Build & Push to ECR
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      ecr_registry: ${{ steps.ecr-login.outputs.registry }}
      image_tag: ${{ steps.set-tag.outputs.image_tag }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Derive image tag from commit SHA ──────────────────────────────────
      # Using the first 7 characters of the commit SHA gives a short, unique,
      # traceable tag (e.g. "a1b2c3d").
      - name: Set image tag
        id: set-tag
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ── Configure AWS credentials ─────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # ── Log in to ECR ─────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build and push ────────────────────────────────────────────────────
      # Two tags are pushed:
      #   1. Commit SHA tag  – immutable, traceable to the exact commit
      #   2. "latest"        – always points to the most recent main build
      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.image_tag }}
        run: |
          docker build \
            -f Docker-files/app/multistage/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 – Update Helm values.yaml in the GitOps repo
  # Runs ONLY on push to main, after docker-build-push succeeds.
  # ═══════════════════════════════════════════════════════════════════════════
  update-helm:
    name: Update Helm Chart Image Tag
    runs-on: ubuntu-24.04
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # ── Clone the Helm GitOps repo ────────────────────────────────────────
      # GITOPS_PAT is a Personal Access Token with repo write access.
      # HELM_REPO_USER is the GitHub username that owns the PAT.
      # HELM_REPO_NAME is the repository name (e.g. "vprofile-helm").
      - name: Clone Helm repo
        run: |
          git clone \
            "https://${{ secrets.HELM_REPO_USER }}:${{ secrets.GITOPS_PAT }}@github.com/${{ secrets.HELM_REPO_USER }}/${{ vars.HELM_REPO_NAME }}.git" \
            helm-repo

      # ── Install yq ────────────────────────────────────────────────────────
      # yq v4 is used for surgical, type-safe YAML edits that preserve all
      # other keys in values.yaml untouched.
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # ── Patch app.image and app.tag ───────────────────────────────────────
      - name: Update image and tag in values.yaml
        env:
          ECR_REGISTRY: ${{ needs.docker-build-push.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
        run: |
          cd vprofile-helm
          yq -i '.app.image = strenv(ECR_REGISTRY) + "/" + strenv(ECR_REPOSITORY)' values.yaml
          yq -i '.app.tag = strenv(IMAGE_TAG)' values.yaml

      # ── Commit and push ───────────────────────────────────────────────────
      - name: Commit and push updated values.yaml
        env:
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
        run: |
          cd vprofile-helm
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values.yaml
          git commit -m "ci: update app image tag to ${IMAGE_TAG} [skip ci]"
          git push
